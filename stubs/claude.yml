# Stub. @claude mention handler; the real workflow lives in sufnevan-sketch/gh-workflows.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  mention:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    uses: sufnevan-sketch/gh-workflows/.github/workflows/claude.yml@main
    secrets:
      # Explicit, never `inherit`: GitHub passes inherited secrets only to a
      # reusable workflow in the SAME org or enterprise. This repo is a user
      # account, so an org caller inherits nothing and the call fails in 2s with
      # "Secret <NAME> is required, but not provided while calling"
      # (camedu-io/district-intel PR #1, 2026-09-17). Naming a secret that is not
      # set is safe: it resolves empty.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
