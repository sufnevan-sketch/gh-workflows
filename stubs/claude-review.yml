# Stub. The real workflow lives in sufnevan-sketch/gh-workflows; project context
# goes in .github/review-context.md, not here. Check name: "claude / claude-review".
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write
  actions: read

jobs:
  claude:
    uses: sufnevan-sketch/gh-workflows/.github/workflows/claude-review.yml@main
    secrets:
      # Explicit, never `inherit`: GitHub passes inherited secrets only to a
      # reusable workflow in the SAME org or enterprise. This repo is a user
      # account, so an org caller inherits nothing and the call fails in 2s with
      # "Secret <NAME> is required, but not provided while calling"
      # (camedu-io/district-intel PR #1, 2026-09-17). Naming a secret that is not
      # set is safe: it resolves empty.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
