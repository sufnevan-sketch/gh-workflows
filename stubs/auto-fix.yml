# Stub, OPT-IN (install.ps1 -WithAutoFix). CI fixes review findings so the
# session that opened the PR can move on: blocking findings on a red review (max 3
# rounds), then ONE pass over open non-blocking threads during the gate's fix
# window. Needs secret AUTOFIX_PAT; with it unset every step is skipped.
name: auto-fix

on:
  workflow_run:
    workflows: ["CI", "Claude Code Review", "Codex Review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: auto-fix-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  fix:
    uses: sufnevan-sketch/gh-workflows/.github/workflows/auto-fix.yml@main
    secrets:
      # Explicit, never `inherit`: GitHub passes inherited secrets only to a
      # reusable workflow in the SAME org or enterprise. This repo is a user
      # account, so an org caller inherits nothing and the call fails in 2s with
      # "Secret <NAME> is required, but not provided while calling"
      # (camedu-io/district-intel PR #1, 2026-09-17). Naming a secret that is not
      # set is safe: it resolves empty.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AUTOFIX_PAT: ${{ secrets.AUTOFIX_PAT }}
