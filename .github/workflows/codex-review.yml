# codex-review.yml (reusable) — second, cross-family review by Codex for code
# work only. Check name: "codex / codex-review".
#
# Runs when the head branch type (branch-name skill: `<type>/<short-description>`)
# says this is code: feat/ fix/ refactor/ perf/ build/. Business and housekeeping
# branches (docs/ chore/ spike/ wo/ and area-named branches) skip it unless the
# PR carries the label `codex-review` or `risk:high`. auto-merge.yml applies the
# same rule and then requires this check to pass (its codex-branch-prefixes /
# codex-labels inputs; keep the two lists identical).
#
# Two modes (input `mode`):
#   cloud  (default) Codex cloud code review, included in the ChatGPT plan. The
#          job comments `@codex review` on the PR, waits for the
#          chatgpt-codex-connector[bot] review on the head SHA, and goes red when
#          any inline finding carries a P0/P1 badge. Needs: the Codex GitHub
#          connector installed for the repo's owner, the repo listed in Codex
#          settings, and personal "Auto review" OFF (so only these PRs get one).
#          Codex reads the repo's AGENTS.md, not review-context.md.
#   action openai/codex-action@v1 with an OPENAI_API_KEY (platform key, metered).
#          Read-only sandbox, our prompt, our review-context.md.
# Both post ONE review whose first line is `CODEX-REVIEW: PASS` or
# `CODEX-REVIEW: CHANGES REQUESTED`, so humans and the local fix loop read one
# format either way.
name: Codex Review (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: "cloud (ChatGPT plan, @codex review) | action (openai/codex-action, API key)"
        type: string
        default: cloud
      wait-minutes:
        description: "cloud: how long to wait for the Codex review before failing"
        type: number
        default: 20
      trigger-comment:
        type: string
        default: "@codex review"
      context-file:
        type: string
        default: .github/review-context.md
      model:
        description: "action: Codex model; blank = Codex default. Default matches the solo-harness evaluator of Claude's work."
        type: string
        default: gpt-6-astra
      effort:
        type: string
        default: high
    secrets:
      OPENAI_API_KEY:
        required: false
      CODEX_TRIGGER_PAT:
        description: "cloud: PAT of a GitHub user connected to Codex. Codex ignores @codex mentions from github-actions[bot] (verified 2026-09-17: it replies 'create a Codex account and connect to github')."
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  codex-review:
    name: codex-review
    if: >-
      !github.event.pull_request.draft && (
        startsWith(github.head_ref, 'feat/') ||
        startsWith(github.head_ref, 'fix/') ||
        startsWith(github.head_ref, 'refactor/') ||
        startsWith(github.head_ref, 'perf/') ||
        startsWith(github.head_ref, 'build/') ||
        contains(github.event.pull_request.labels.*.name, 'codex-review') ||
        contains(github.event.pull_request.labels.*.name, 'risk:high'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CODEX_BOT: chatgpt-codex-connector[bot]
    steps:
      # ---------------------------------------------------------------- cloud
      - name: Ask Codex for a review (cloud)
        if: inputs.mode == 'cloud'
        env:
          GH_TOKEN: ${{ secrets.CODEX_TRIGGER_PAT }}
          PAT_SET: ${{ secrets.CODEX_TRIGGER_PAT != '' }}
          TRIGGER: ${{ inputs.trigger-comment }}
        run: |
          if [ "$PAT_SET" != "true" ]; then
            echo "::error::Secret CODEX_TRIGGER_PAT is not set. Codex cloud review only honors '@codex review' from a GitHub user connected to Codex, never from github-actions[bot]. Set it (set-secrets.ps1 -Names CODEX_TRIGGER_PAT) or switch the stub to mode: action."
            exit 1
          fi
          # Idempotent per head SHA: skip if Codex already reviewed this commit.
          # Two shapes: a review object when Codex has findings, and only an
          # issue comment ("Reviewed commit: <sha10>") when it has none.
          export SHA10="${HEAD_SHA:0:10}"
          have=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews?per_page=100" \
            --jq '[.[] | select(.user.login == env.CODEX_BOT and .commit_id == env.HEAD_SHA)] | length')
          have_clean=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
            --jq '[.[] | select(.user.login == env.CODEX_BOT and (.body | contains("Reviewed commit")) and (.body | contains(env.SHA10)))] | length')
          if [ "${have:-0}" -gt 0 ] || [ "${have_clean:-0}" -gt 0 ]; then
            echo "Codex already reviewed ${HEAD_SHA:0:7}; not re-asking"; exit 0
          fi
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "${TRIGGER} (commit ${HEAD_SHA:0:7}; requested by the codex-review check)"
          echo "asked for a review of ${HEAD_SHA:0:7}"

      - name: Wait for the Codex review on this commit (cloud)
        if: inputs.mode == 'cloud'
        id: cloud
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_MIN: ${{ inputs.wait-minutes }}
        run: |
          deadline=$(( $(date +%s) + WAIT_MIN * 60 ))
          export SHA10="${HEAD_SHA:0:10}"
          # A clean Codex run leaves NO review object, only an issue comment
          # naming the commit it reviewed, so waiting on reviews alone burns the
          # full timeout on a PR Codex already finished (verified 2026-09-17,
          # camedu-io/district-intel PR #2). Accept either shape.
          while :; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews?per_page=100" \
              --jq '[.[] | select(.user.login == env.CODEX_BOT and .commit_id == env.HEAD_SHA)] | length')
            m=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?per_page=100" \
              --jq '[.[] | select(.user.login == env.CODEX_BOT and (.body | contains("Reviewed commit")) and (.body | contains(env.SHA10)))] | length')
            if [ "${n:-0}" -gt 0 ] || [ "${m:-0}" -gt 0 ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::No Codex review on ${HEAD_SHA:0:7} after ${WAIT_MIN} min. Is the Codex GitHub connector installed for this owner, the repo listed in Codex settings, and CODEX_TRIGGER_PAT a user connected to Codex?"
              exit 1
            fi
            sleep 30
          done
          # Findings = inline review comments by the bot on this commit carrying a P0/P1 badge.
          # original_commit_id, not commit_id: when a later push leaves the commented
          # line in the diff, GitHub re-anchors the old comment and rewrites its
          # commit_id to the new head, so findings already fixed kept failing every
          # later round (seen 2026-09-21 on a three-round PR).
          # original_commit_id stays the commit Codex actually reviewed.
          findings=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR}/comments?per_page=100" \
            --jq '.[] | select(.user.login == env.CODEX_BOT and .original_commit_id == env.HEAD_SHA and (.body | test("badge/P[01]-"))) | "\(.path):\(.line // .original_line) - \((.body | capture("badge/(?<p>P[01])-").p)): \(.body | split("\n")[0] | gsub("![[]P[01] Badge[]][(][^)]*[)]|<sub>|</sub>|[*]"; "") | .[0:160])"')
          count=$(printf '%s' "$findings" | grep -c . || true)
          verdict=$([ "$count" -eq 0 ] && echo "PASS" || echo "CHANGES REQUESTED")
          {
            echo "CODEX-REVIEW: ${verdict}"
            echo
            echo "Codex cloud review of ${HEAD_SHA:0:7}: ${count} P0/P1 finding(s). Inline comments by ${CODEX_BOT} are the source; this summary is parsed by the merge gate."
            if [ "$count" -gt 0 ]; then echo; echo "Findings:"; printf '%s\n' "$findings" | nl -w1 -s'. '; fi
          } > /tmp/verdict.md
          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --comment --body-file /tmp/verdict.md
          cat /tmp/verdict.md >> "$GITHUB_STEP_SUMMARY"
          echo "verdict=${verdict}" >> "$GITHUB_OUTPUT"
          if [ "$verdict" != "PASS" ]; then echo "::error::Codex found ${count} P0/P1 issue(s); see the inline comments on PR #${PR}"; exit 1; fi

      # --------------------------------------------------------------- action
      - if: inputs.mode == 'action'
        uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Fetch base and head refs (action)
        if: inputs.mode == 'action'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR/head"

      - name: Read project context from the base branch (action)
        if: inputs.mode == 'action'
        id: ctx
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CONTEXT_FILE: ${{ inputs.context-file }}
        run: |
          {
            echo "text<<CTX_EOF"
            git show "origin/${BASE_REF}:${CONTEXT_FILE}" 2>/dev/null \
              || echo "(no ${CONTEXT_FILE} on ${BASE_REF}; review against general best practice and the repo's own AGENTS.md / CLAUDE.md if present)"
            echo
            echo "CTX_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Codex reviews the PR (action)
        if: inputs.mode == 'action'
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: read-only
          model: ${{ inputs.model }}
          effort: ${{ inputs.effort }}
          output-schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["verdict", "summary", "findings"],
              "properties": {
                "verdict": { "type": "string", "enum": ["PASS", "CHANGES REQUESTED"] },
                "summary": { "type": "string" },
                "findings": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": ["severity", "path", "line", "problem", "fix"],
                    "properties": {
                      "severity": { "type": "string", "enum": ["CRITICAL", "HIGH", "MEDIUM", "LOW"] },
                      "path": { "type": "string" },
                      "line": { "type": "integer" },
                      "problem": { "type": "string" },
                      "fix": { "type": "string" }
                    }
                  }
                }
              }
            }
          prompt: |
            You are the second, independent reviewer of PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            A Claude review has already run or is running; do not assume it caught anything. Review ONLY the changes this PR introduces:
              git diff ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
              git log --oneline ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}

            Project context (from the repo's ${{ inputs.context-file }}):
            ${{ steps.ctx.outputs.text }}

            Look for, in priority order:
            1. Correctness bugs: logic errors, broken edge cases, swallowed errors, race conditions, stray debug output, secrets in the diff.
            2. Unmet acceptance criteria: what the PR title and body promise that the diff does not deliver.
            3. Security and data safety: injection, auth bypass, data loss, unsafe defaults.
            4. Missing tests for genuine logic. Do not demand tests for glue or config.

            Severity: CRITICAL = security hole, data loss, leaked secret. HIGH = real bug or unmet criterion. MEDIUM = maintainability. LOW = style.
            Verdict: PASS when there is no CRITICAL or HIGH finding; otherwise CHANGES REQUESTED.
            Be specific: exact path and line in the head commit, what is wrong, how to fix. Skip praise and nits. If nothing is worth flagging, return PASS with an empty findings list and say so; do not manufacture findings.

            PR title and body:
            ----
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}

      - name: Post review and gate on verdict (action)
        if: inputs.mode == 'action'
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ steps.codex.outputs.final-message }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            let out;
            try { out = JSON.parse(process.env.CODEX_FINAL_MESSAGE || ""); }
            catch (e) { core.setFailed(`Codex produced no parseable verdict: ${(process.env.CODEX_FINAL_MESSAGE || "").slice(0, 500)}`); return; }
            const verdict = out.verdict === "PASS" ? "PASS" : "CHANGES REQUESTED";
            const findings = Array.isArray(out.findings) ? out.findings : [];
            const lines = [`CODEX-REVIEW: ${verdict}`, "", out.summary || ""];
            if (findings.length) {
              lines.push("", "Findings:");
              findings.forEach((f, i) => lines.push(`${i + 1}. ${f.path}:${f.line} - ${f.severity}: ${f.problem} Fix: ${f.fix}`));
            }
            const body = lines.join("\n");
            const comments = findings
              .filter(f => ["CRITICAL", "HIGH"].includes(f.severity) && f.path && f.line > 0)
              .map(f => ({ path: f.path, line: f.line, side: "RIGHT", body: `${f.severity}: ${f.problem}\n\nFix: ${f.fix}` }));
            const post = async (withInline) => github.rest.pulls.createReview({
              owner, repo, pull_number: number, commit_id: process.env.HEAD_SHA, event: "COMMENT", body,
              ...(withInline && comments.length ? { comments } : {}),
            });
            try { await post(true); }
            catch (e) { core.warning(`inline comments rejected (${e.message}); posting summary only`); await post(false); }
            core.summary.addRaw(body).write();
            if (verdict !== "PASS") core.setFailed(`Codex requested changes: ${findings.filter(f => ["CRITICAL", "HIGH"].includes(f.severity)).length} CRITICAL/HIGH finding(s)`);
