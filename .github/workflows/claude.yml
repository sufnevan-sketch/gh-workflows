# claude.yml (reusable) — @claude mention handler. The stub (stubs/claude.yml)
# holds the triggers and the "@claude mentioned" condition; this runs Claude on
# the instructions in that comment, issue, or review.
name: Claude Code (reusable)

on:
  workflow_call:
    inputs:
      claude-args:
        description: "Extra Claude CLI args, e.g. --allowed-tools \"Bash(gh pr *)\""
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  claude:
    name: claude
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: ${{ inputs.claude-args }}
