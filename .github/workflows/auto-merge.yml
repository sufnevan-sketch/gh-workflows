# auto-merge.yml (reusable) — squash-merge a PR once every check on its head SHA
# is green, including the Claude review and, for code branches, the Codex
# review. Check name: "gate / auto-merge".
#
# Why this exists instead of GitHub's own auto-merge: on a private repo on the
# free plan there is no branch protection and no rulesets, so there are no
# "required checks", and `gh pr merge --auto` merges INSTANTLY, before CI has
# run. This workflow is the required check + auto-merge, implemented in a script.
#
# Triggers live in the calling repo's stub (stubs/auto-merge.yml): `workflow_run`
# on CI and both reviews (fires whoever finishes last), `pull_request_review`
# for a human review, `workflow_dispatch` to drain every open PR. Never use
# `check_suite`: GitHub does not fire it for suites created by Actions
# (recursion guard).
#
# A PR squash-merges when ALL hold:
#   1. open, not draft, title/body do not start with BLOCKED, head branch not
#      under skip-branch-prefixes, same-repo head, touches nothing under
#      .github/workflows/ (the gate never auto-merges a change to itself).
#   2. no reviewer has an outstanding CHANGES_REQUESTED.
#   3. every check run on the head SHA finished success/neutral/skipped, each
#      name in required-checks is present and succeeded, and codex-check
#      succeeded when the branch/label rule says Codex applies.
#   4. Fix window (only when fix-window-minutes > 0 and the repo has an active
#      `auto-fix` workflow): while non-blocking bot threads (Codex P2/P3, Claude
#      MEDIUM/LOW) are unresolved and not outdated, hold until auto-fix.yml's one
#      pass is done, none is open, or the last check's completion + the window has
#      passed, whichever comes first. One window per PR, recorded by a
#      `<!-- fix-window:until=... -->` gate comment, so a fix push does not open a
#      second one. BLOCKED during the window holds the PR past it. After a
#      `[review-fix]` commit the gate never holds the PR again.
#      No run waits for the window: a hold posts the marker and exits, because a
#      sleeping runner is billed on a private repo. Events that already start the
#      gate close it: a push (its checks complete), auto-fix's pass-done COMMENT
#      review (`<!-- auto-fix:nonblocking-done -->`, made with AUTOFIX_PAT so it
#      fires `pull_request_review`), any other review, or a dispatch. Every run
#      also re-evaluates the other open PRs whose window has expired, so a
#      deadline is acted on by the next gate run in the repo. With no event at all
#      (AUTOFIX_PAT unset, auto-fix runner lost) the PR waits, never merges early:
#      `gh workflow run auto-merge` after the deadline merges it.
# The merge uses the caller's GITHUB_TOKEN (terminal action, nothing to cascade).
# Output `merged-prs` lists what this run merged; the stub's `ledger` job hands it
# to review-ledger.yml, because a GITHUB_TOKEN merge fires no `pull_request: closed`.
# Kill switch: delete the stub, or put BLOCKED at the start of a PR title.
name: auto-merge (reusable)

on:
  workflow_call:
    inputs:
      required-checks:
        description: "Comma list of check names that must be present and green"
        type: string
        default: "ci / verify,claude / claude-review"
      codex-check:
        type: string
        default: "codex / codex-review"
      codex-branch-prefixes:
        description: "Head-branch prefixes where the Codex review is required (same rule as codex-review.yml)"
        type: string
        default: "feat/,fix/,refactor/,perf/,build/"
      codex-labels:
        type: string
        default: "codex-review,risk:high"
      skip-branch-prefixes:
        description: "Head-branch prefixes the gate leaves alone (solo-harness ship.ps1 merges wo/ itself)"
        type: string
        default: "wo/"
      merge-method:
        type: string
        default: squash
      delete-branch:
        type: boolean
        default: true
      fix-window-minutes:
        description: "Pre-merge fix window: hold a green PR this long after its last check while non-blocking bot threads are open. 0 = off (default, so repos on an old stub are unaffected); capped at 20."
        type: number
        default: 0
      fix-window-skip-prefixes:
        description: "Head-branch prefixes that never get a window (no session is there to use it)"
        type: string
        default: "fix/ledger-"
      fix-window-poll-seconds:
        description: "Ignored since the gate stopped waiting for the window (kept so callers that pass it still parse)"
        type: number
        default: 30
      auto-fix-workflow:
        description: "Workflow name of the caller's auto-fix stub. With no active workflow of this name the gate opens no window (nothing would act in it). Empty = skip the check."
        type: string
        default: "auto-fix"
      review-bots:
        description: "Reviewer logins whose unresolved threads hold the window (same list as review-ledger.yml)"
        type: string
        default: "claude[bot],chatgpt-codex-connector[bot],github-actions[bot]"
    outputs:
      merged-prs:
        description: "Comma list of PR numbers this run merged (feeds review-ledger.yml)"
        value: ${{ jobs.auto-merge.outputs.merged }}

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: read

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    # The gate never waits for the window (see 4. above): a run is API calls only.
    timeout-minutes: 10
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    env:
      REQUIRED_CHECKS: ${{ inputs.required-checks }}
      CODEX_CHECK: ${{ inputs.codex-check }}
      CODEX_BRANCH_PREFIXES: ${{ inputs.codex-branch-prefixes }}
      CODEX_LABELS: ${{ inputs.codex-labels }}
      SKIP_BRANCH_PREFIXES: ${{ inputs.skip-branch-prefixes }}
      MERGE_METHOD: ${{ inputs.merge-method }}
      DELETE_BRANCH: ${{ inputs.delete-branch }}
      FIX_WINDOW_MINUTES: ${{ inputs.fix-window-minutes }}
      FIX_WINDOW_SKIP_PREFIXES: ${{ inputs.fix-window-skip-prefixes }}
      AUTO_FIX_WORKFLOW: ${{ inputs.auto-fix-workflow }}
      REVIEW_BOTS: ${{ inputs.review-bots }}
    steps:
      - id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const merged = [];
            const list = v => (v || "").split(",").map(s => s.trim()).filter(Boolean);
            const REQUIRED = list(process.env.REQUIRED_CHECKS);
            const SKIP_PREFIXES = list(process.env.SKIP_BRANCH_PREFIXES);
            const CODEX_PREFIXES = list(process.env.CODEX_BRANCH_PREFIXES);
            const CODEX_LABELS = list(process.env.CODEX_LABELS);
            const WINDOW_MS = Math.min(Math.max(Number(process.env.FIX_WINDOW_MINUTES) || 0, 0), 20) * 60000;
            const WINDOW_SKIP = list(process.env.FIX_WINDOW_SKIP_PREFIXES);
            const BOTS = new Set(list(process.env.REVIEW_BOTS));
            const WINDOW_MARK = /<!-- fix-window:until=([0-9T:.\-Z]+) -->/;
            // auto-fix.yml's pass: claimed by a github-actions[bot] comment, finished by a
            // COMMENT review from its PAT (the event that re-runs this gate) and an edit of
            // the claim comment (in case the review could not be posted).
            const DONE_MARK = "<!-- auto-fix:nonblocking-done -->";
            const TRUSTED = new Set(["OWNER", "MEMBER", "COLLABORATOR"]);
            const openPRs = async () => github.paginate(github.rest.pulls.list, { owner, repo, state: "open", per_page: 100 });

            // --- Candidate PR numbers, by trigger ---
            let prNumbers = [];
            if (context.eventName === "workflow_run") {
              const run = context.payload.workflow_run;
              if (run.conclusion !== "success") { core.info(`${run.name} concluded ${run.conclusion}; nothing to merge`); return; }
              prNumbers = (run.pull_requests || []).map(p => p.number);
              if (prNumbers.length === 0) {
                // pull_requests is often empty; match open PRs by head SHA instead.
                prNumbers = (await openPRs()).filter(p => p.head.sha === run.head_sha).map(p => p.number);
              }
            } else if (context.eventName === "pull_request_review") {
              prNumbers = [context.payload.pull_request.number];
            } else {
              prNumbers = (await openPRs()).map(p => p.number);
            }
            if (prNumbers.length === 0) { core.info("no candidate PRs"); return; }

            // Every merge condition except the fix window.
            const evaluate = async number => {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const no = reason => ({ ok: false, reason });
              if (pr.state !== "open") return no("not open");
              if (pr.draft) return no("draft");
              const blocked = (pr.title || "").trimStart().startsWith("BLOCKED") || (pr.body || "").trimStart().startsWith("BLOCKED");
              if (blocked) return no("BLOCKED marker");
              if (SKIP_PREFIXES.some(p => pr.head.ref.startsWith(p))) return no(`branch ${pr.head.ref} is merged by its own tooling`);
              if (pr.head.repo && pr.head.repo.full_name !== `${owner}/${repo}`) return no("fork PR, human merge required");

              // --- Safety rail: never auto-merge a PR that edits the CI/gate itself ---
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: number, per_page: 100 });
              if (files.some(f => f.filename.startsWith(".github/workflows/"))) return no("touches .github/workflows/**, human merge required");

              // --- Review gate: no outstanding CHANGES_REQUESTED (latest state per reviewer) ---
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
              const latestByUser = new Map();
              for (const r of reviews) {
                if (!r.user || !["APPROVED", "CHANGES_REQUESTED", "DISMISSED"].includes(r.state)) continue;
                latestByUser.set(r.user.login, r);
              }
              if ([...latestByUser.values()].some(r => r.state === "CHANGES_REQUESTED")) return no("outstanding CHANGES_REQUESTED");

              // --- Checks gate: everything on the head SHA green, required ones present ---
              const checkRuns = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 });
              // Keep only the newest run per check name. A re-run, or two events racing
              // into the same concurrency group, leaves the superseded run on the SHA with
              // conclusion "cancelled"; counting it means one cancelled run blocks the
              // merge forever even after the real run goes green (verified 2026-09-17,
              // camedu-io/crm PR #5, where opened+labeled fired one second apart).
              // GitHub's own checks UI dedupes the same way.
              // Skip this workflow's own jobs: a gate run triggered by pull_request_review
              // posts `gate / auto-merge` and its sibling `ledger / review-ledger` on the
              // PR head (seen on camedu-io/crm #19), and the ledger job sits pending on
              // `needs: gate` while an overlapping gate run evaluates.
              const newest = new Map();
              // auto-fix's check too: it runs beside the gate on the same completions and
              // only reports back through its pass-done review, so it must not hold a merge.
              for (const c of checkRuns.filter(c => !/(auto-merge|review-ledger|auto-fix|ledger-expiry)$/.test(c.name))) {
                const prev = newest.get(c.name);
                const t = c2 => new Date(c2.started_at || 0).getTime();
                // started_at decides; id only breaks an exact tie. An `||` on id alone could
                // let an older run displace a newer one, and a stale green is the one
                // direction this gate must never fail in.
                if (!prev || t(c) > t(prev) || (t(c) === t(prev) && c.id > prev.id)) newest.set(c.name, c);
              }
              const relevant = [...newest.values()];
              const pending = relevant.filter(c => c.status !== "completed").map(c => c.name);
              const failed = relevant.filter(c => c.status === "completed" && !["success", "neutral", "skipped"].includes(c.conclusion)).map(c => `${c.name}=${c.conclusion}`);
              const labels = (pr.labels || []).map(l => l.name);
              const codexApplies = CODEX_PREFIXES.some(p => pr.head.ref.startsWith(p)) || CODEX_LABELS.some(l => labels.includes(l));
              const required = codexApplies ? [...REQUIRED, process.env.CODEX_CHECK] : REQUIRED;
              const missing = required.filter(name => !relevant.some(c => c.name === name && c.conclusion === "success"));
              if (pending.length || failed.length || missing.length) {
                return no(`not green on ${pr.head.sha.slice(0, 7)} (pending: [${pending}] failed: [${failed}] required-missing: [${missing}])`);
              }
              const lastDone = Math.max(0, ...relevant.map(c => new Date(c.completed_at || 0).getTime()));
              return { ok: true, pr, relevant, lastDone, reviews };
            };

            // Same severity reading as review-ledger.yml: Codex `![P2 Badge]`, Claude `path:line - MEDIUM:`.
            const NB = new Set(["MEDIUM", "LOW", "P2", "P3"]);
            const sevOf = t => {
              const badge = t.match(/!\[(P[0-3]) Badge\]/);
              if (badge) return badge[1];
              const word = t.replace(/^(\S+:\d+\s+)+(-\s*)?/, "").match(/\b(CRITICAL|HIGH|MEDIUM|LOW|P[0-3])\b/);
              return word ? word[1] : "";
            };
            // Unresolved, current, non-blocking threads opened by a reviewer bot: what the window waits on.
            const openThreads = async number => {
              const open = [];
              let cursor = null;
              do {
                const q = await github.graphql(`
                  query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                    repository(owner: $owner, name: $repo) {
                      pullRequest(number: $number) {
                        reviewThreads(first: 100, after: $cursor) {
                          pageInfo { hasNextPage endCursor }
                          nodes { isResolved isOutdated path comments(first: 1) { nodes { author { login } body } } }
                        }
                      }
                    }
                  }`, { owner, repo, number, cursor });
                const threads = q.repository.pullRequest.reviewThreads;
                for (const t of threads.nodes) {
                  const c = t.comments.nodes[0];
                  if (!c || t.isResolved || t.isOutdated) continue;
                  // GraphQL drops the `[bot]` suffix REST shows; match both forms.
                  const login = c.author ? c.author.login : "";
                  if (!BOTS.has(login) && !BOTS.has(`${login}[bot]`)) continue;
                  // Only what auto-fix's pass acts on; an unrated or blocking thread
                  // would hold the PR for the full window with nobody to handle it.
                  if (!NB.has(sevOf(c.body))) continue;
                  open.push(t.path);
                }
                cursor = threads.pageInfo.hasNextPage ? threads.pageInfo.endCursor : null;
              } while (cursor);
              return open;
            };
            // The window's deadline lives in a gate comment: every gate run reads the same
            // one, and a fix push cannot open a second window.
            // Only the gate's own comments count, and a marker can never push the deadline
            // past one window from now: a stray or forged far-future marker cannot hang the PR.
            // The same comments carry auto-fix's claim, which it edits to DONE_MARK when its pass ends.
            const windowState = async number => {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: number, per_page: 100 });
              const own = comments.filter(c => c.user && c.user.login === "github-actions[bot]");
              const marks = own.map(c => (c.body || "").match(WINDOW_MARK)).filter(Boolean).map(m => new Date(m[1]).getTime()).filter(t => !Number.isNaN(t));
              return {
                until: marks.length ? Math.min(Math.min(...marks), Date.now() + WINDOW_MS) : null,
                done: own.some(c => (c.body || "").includes(DONE_MARK)),
              };
            };
            // No window when nothing would act in it: the caller has no active auto-fix stub.
            let autoFixActive = null;
            const hasAutoFix = async () => {
              const name = process.env.AUTO_FIX_WORKFLOW;
              if (!name) return true;
              if (autoFixActive === null) {
                const wfs = await github.paginate(github.rest.actions.listRepoWorkflows, { owner, repo, per_page: 100 });
                autoFixActive = wfs.some(w => w.name === name && w.state === "active");
              }
              return autoFixActive;
            };

            const handle = async number => {
              const tag = `#${number}`;
              const ev = await evaluate(number);
              if (!ev.ok) { core.info(`${tag}: ${ev.reason}, skip`); return; }

              // --- Fix window: a hold posts the marker if missing and returns. Nothing waits. ---
              let windowNote = "";
              if (WINDOW_MS > 0 && !WINDOW_SKIP.some(p => ev.pr.head.ref.startsWith(p))) {
                const open = await openThreads(number);
                if (open.length) {
                  // One fix round per PR: once a `[review-fix]` commit exists (auto-fix.yml's
                  // non-blocking pass, or a person), the gate merges on green and the rest is ledgered.
                  const commits = await github.paginate(github.rest.pulls.listCommits, { owner, repo, pull_number: number, per_page: 100 });
                  const fixedOnce = commits.some(c => ((c.commit && c.commit.message) || "").includes("[review-fix]"));
                  let state = await windowState(number);
                  // auto-fix's pass-done review (its PAT, so it re-ran this gate). Only a
                  // collaborator's review counts; a forged one could only end the window early.
                  const doneReview = ev.reviews.some(r => TRUSTED.has(r.author_association) && (r.body || "").includes(DONE_MARK));
                  const why = fixedOnce ? "fix round already done ([review-fix] commit)"
                    : (state.done || doneReview) ? "auto-fix's non-blocking pass is done"
                    : !(await hasAutoFix()) ? `no active \`${process.env.AUTO_FIX_WORKFLOW}\` workflow to act in it`
                    : "";
                  if (why) core.info(`${tag}: ${why}, no window`);
                  else {
                    if (state.until === null && ev.lastDone + WINDOW_MS > Date.now()) {
                      const iso = new Date(ev.lastDone + WINDOW_MS).toISOString();
                      await github.rest.issues.createComment({ owner, repo, issue_number: number, body:
                        `<!-- fix-window:until=${iso} -->\n⏳ Fix window: ${open.length} non-blocking review thread(s) open on ${ev.pr.head.sha.slice(0, 7)}. ` +
                        `The gate merges once auto-fix's one pass is done or none is open, and at the latest on its first run after ${iso} (UTC). Per thread: **fix** = push (put \`[review-fix]\` in the commit message); ` +
                        `**drop** = reply with the reason and resolve it; **defer** = leave it, it goes to the \`review-ledger\` issue. ` +
                        `\`BLOCKED\` at the start of the title holds the PR past the window. One window per PR.` });
                      state = await windowState(number); // a racing gate run may have posted first; the earliest wins
                    }
                    if (state.until !== null && Date.now() < state.until) {
                      core.notice(`${tag}: held by the fix window until ${new Date(state.until).toISOString()} (${open.length} thread(s)). No run waits: auto-fix's pass-done review, a push or a review re-runs the gate; after that time any gate run in this repo merges it (or \`gh workflow run auto-merge\`).`);
                      return;
                    }
                  }
                }
                windowNote = open.length ? ` ${open.length} non-blocking thread(s) left open go to the review ledger.` : "";
              }

              // --- Merge ---
              const { pr, relevant } = ev;
              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: number,
                  merge_method: process.env.MERGE_METHOD,
                  commit_title: `${pr.title} (#${number})`,
                  sha: pr.head.sha, // refuse if the head moved since we evaluated it
                });
                merged.push(number);
                core.notice(`${tag}: ${process.env.MERGE_METHOD}-merged by auto-merge gate (checks: ${relevant.map(c => c.name).join(", ")})`);
                await github.rest.issues.createComment({ owner, repo, issue_number: number,
                  body: `🤖 auto-merged: all checks green on ${pr.head.sha.slice(0, 7)} (${relevant.map(c => c.name).join(", ")}).${windowNote}` });
                if (process.env.DELETE_BRANCH === "true") {
                  try { await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }); }
                  catch (e) { core.info(`${tag}: branch delete skipped: ${e.message}`); }
                }
              } catch (e) {
                core.warning(`${tag}: merge failed: ${e.message}`);
              }
            };

            try {
              for (const number of prNumbers) await handle(number);
              // --- Expired windows: nothing wakes a held PR at its deadline (no run waits, and
              // a cron would bill minutes), so every run re-evaluates the other open PRs whose
              // window has passed. A drain already covered every open PR. A marker can only be
              // on a PR touched within the last day + window; older PRs cost no extra call.
              if (WINDOW_MS > 0 && context.eventName !== "workflow_dispatch") {
                const seen = new Set(prNumbers);
                const since = Date.now() - WINDOW_MS - 24 * 3600000;
                for (const p of await openPRs()) {
                  if (seen.has(p.number) || p.draft || new Date(p.updated_at).getTime() < since) continue;
                  const { until } = await windowState(p.number);
                  if (until === null || Date.now() < until) continue;
                  core.info(`#${p.number}: fix window ended ${new Date(until).toISOString()}, re-evaluating`);
                  await handle(p.number);
                }
              }
            } finally {
              // The caller's review-ledger job files non-blocking findings for these.
              // It cannot hang off `pull_request: closed`: a merge made with
              // GITHUB_TOKEN fires no workflow events.
              core.setOutput("merged", merged.join(","));
            }
