# self-route.yml — this repo's codex-route stub (see stubs/codex-route.yml).
# Dispatches self-review.yml's verdict run when Codex answers. Keep the name
# out of self-gate's `workflow_run` list.
name: self-route

on:
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  actions: write
  pull-requests: read

jobs:
  route:
    if: >-
      github.event.sender.login == 'chatgpt-codex-connector[bot]' && (
        github.event_name == 'pull_request_review' ||
        (github.event.issue.pull_request && contains(github.event.comment.body, 'Reviewed commit')))
    uses: ./.github/workflows/codex-route.yml
    with:
      codex-workflow: self-review.yml
    secrets:
      DISPATCH_TOKEN: ${{ secrets.CODEX_TRIGGER_PAT }}
